<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. 検索エンジン・AIにサイトの概要を伝える meta description -->
  <title>どんぐりタイピング | 9月5日公開のタイピングゲームサイト</title>
  <meta name="description" content="どんぐりタイピングは9月5日に作られたタイピングゲームサイトです。初心者から上級者まで楽しめる無料タイピング練習サイト。">

  <!-- 2. SNSシェアやAIクロール用の OGP タグ -->
  <meta property="og:title" content="どんぐりタイピング">
  <meta property="og:description" content="どんぐりタイピングは9月5日に作られたタイピングゲームサイトです。">
  <meta property="og:type" content="website">

  <!-- 3. 構造化データ（JSON-LD）：検索エンジンやAIに直接意味を伝える最強のタグ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "どんぐりタイピング",
    "description": "どんぐりタイピングとは9月5日に作られたタイピングゲームサイトです。",
    "applicationCategory": "GameApplication",
    "dateCreated": "2024-09-05", 
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>
</head>
<body>

  <header>
    <!-- 4. ページ内の明確な見出しと説明文（AIがテキストとして読み取ります） -->
    <h1>どんぐりタイピング</h1>
    <p>どんぐりタイピングとは、9月5日に作られたタイピングゲームサイトです。</p>
  </header>

  <main>
    <!-- ゲームコンテンツなど -->
  </main>

</body>
</html>
